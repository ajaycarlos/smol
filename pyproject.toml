[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smol"
version = "0.4.0"
description = "Shrink any file to at most a chosen size"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.0.0",
    "pillow-heif>=0.15.0",
    "PySide6-Essentials>=6.6.0",
    "python-xlib>=0.33",
]

[project.scripts]
smol = "smol.cli:main"

[tool.setuptools.packages.find]
include = ["smol*"]

[tool.pytest.ini_options]
addopts = "--tb=short --no-header"

[tool.ruff.lint]
extend-select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
